# Short-drama / AI comic script budgets (project_mode=short_drama).
# Replaces chapter.yaml word gates for episode scripts.
version: 1

# Soft target band for script body chars (after title line).
word_min: 800
word_max: 3500
# Hard floor / ceiling for publish.
word_hard_min: 400
word_hard_max: 8000

# Scene count soft guidance (validated lightly in schema / prompts).
scene_min: 2
scene_max: 12

# Soft dialogue-line guidance (approximate).
dialogue_lines_min: 8
dialogue_lines_max: 120

# Target duration hint injected into planner/writer (seconds).
default_duration_sec: 90

# Soft-short streak escalate (0 = never).
soft_short_auto_revise_after: 0
