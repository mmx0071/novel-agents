# Agent 注册表 — MVP 默认启用，扩展 Agent 按需激活
# Phase B：activation 条件仅产生「建议」，由 Orchestrator LLM + activation-policy Skill 决策；
# 运行时可用工具 activate_agents 显式激活扩展 Agent

agents:
  # ── MVP 最小集（默认 active） ──
  orchestrator:
    name: Orchestrator
    layer: orchestration
    tier: mvp
    default_active: true
    description: 任务调度、依赖解析、冲突仲裁、状态机推进

  studio_agent:
    name: NovelX Agent
    layer: orchestration
    tier: mvp
    default_active: true
    description: NovelX 调度层 — REACT 解析用户意图，分配给功能 Agent

  chapter_planner:
    name: Chapter Planner
    layer: story
    tier: mvp
    default_active: true
    description: 输出单章详细章纲
    depends_on: []

  writer:
    name: Writer
    layer: production
    tier: mvp
    default_active: true
    description: 按章纲撰写正文初稿
    depends_on: [chapter_planner]

  consistency_auditor:
    name: Consistency Auditor
    layer: qa
    tier: mvp
    default_active: true
    description: 检查人物、时间线、设定一致性
    depends_on: [writer]

  summarizer:
    name: Summarizer
    layer: memory
    tier: mvp
    default_active: true
    description: 生成章节摘要与新事实清单
    depends_on: [consistency_auditor]

  plot_acceptor:
    name: Plot Acceptor
    layer: story
    tier: mvp
    default_active: true
    description: 对照进行中剧情卡收束条件验收本章；通过则自动 completed
    depends_on: [summarizer]

  # ── 扩展 Agent（按需激活） ──
  world_architect:
    name: World Architect
    layer: world
    tier: extended
    default_active: false
    description: 搭建世界观 Bible
    activation:
      - condition: no_bible
        reason: 项目尚无世界观 Bible
      - condition: bible_stale
        reason: 设定变更超过 3 次未同步 Bible

  lore_librarian:
    name: Lore Librarian
    layer: world
    tier: mvp
    default_active: true
    description: 维护结构化知识库，章纲后 query、摘要后 assert
    depends_on: [chapter_planner]
    activation:
      - condition: entity_count_gt
        threshold: 20
        reason: 实体数量超过 20，需要结构化知识库
      - condition: chapter_count_gt
        threshold: 5
        reason: 已发布超过 5 章，需要 RAG 检索

  nomenclature_curator:
    name: Nomenclature Curator
    layer: world
    tier: extended
    default_active: false
    description: 为人物/物品/设定取名，名与能力语义绑定，规避语料高频名
    activation:
      - condition: no_nomenclature
        reason: 尚无名词表，需建立与能力绑定的命名体系
      - condition: has_bible
        reason: 世界观已建立，启用取名 Agent 管理全书名词
      - condition: has_new_entity_hints
        reason: 本章出现未登记的新实体待命名

  master_planner:
    name: Master Planner
    layer: story
    tier: extended
    default_active: false
    description: 制定总纲
    activation:
      - condition: no_master_outline
        reason: 尚无总纲
      - condition: chapter_count_gt
        threshold: 30
        reason: 超过 30 章需复盘总纲偏离度

  arc_planner:
    name: Arc Planner
    layer: story
    tier: extended
    default_active: false
    description: 规划单卷/故事弧
    activation:
      - condition: no_arc_outline
        reason: 当前卷尚无卷纲
      - condition: chapters_in_arc_gt
        threshold: 8
        reason: 本卷已有 8+ 章但未规划卷纲

  dialogue_specialist:
    name: Dialogue Specialist
    layer: production
    tier: extended
    default_active: false
    description: 专改对话声线与潜台词
    activation:
      - condition: dialogue_ratio_gt
        threshold: 0.4
        reason: 本章对话占比超过 40%
      - condition: character_count_gt
        threshold: 4
        reason: 同场对话人物超过 4 人

  scene_specialist:
    name: Scene Specialist
    layer: production
    tier: extended
    default_active: false
    description: 专改场景与动作描写
    activation:
      - condition: has_scene_tags
        tags: [battle, chase, action, climax]
        reason: 章纲标记为战斗/追逐/高潮场景

  foreshadow_tracker:
    name: Foreshadow Tracker
    layer: qa
    tier: extended
    default_active: false
    description: 追踪伏笔埋收
    activation:
      - condition: active_foreshadows_gt
        threshold: 5
        reason: 活跃伏笔超过 5 条
      - condition: chapter_count_gt
        threshold: 10
        reason: 超过 10 章需系统化伏笔管理

  pacing_reviewer:
    name: Pacing Reviewer
    layer: qa
    tier: mvp
    default_active: true
    description: 检查节奏与信息密度
    activation:
      - condition: word_count_gt
        threshold: 5000
        reason: 本章超过 5000 字需节奏审查
      - condition: audit_fail_rate_gt
        threshold: 0.2
        reason: 近 5 章质检 FAIL 率超过 20%

  literary_editor:
    name: Literary Editor
    layer: qa
    tier: extended
    default_active: false
    description: 润色表达、去 AI 腔
    activation:
      # Minimal rule activation: avoid always-on (costly); unlock after a few chapters.
      - condition: chapter_count_gt
        threshold: 3
        reason: 已发布超过 3 章，启用文学编辑

  # ── 介入式设定 Agent（不进章流水线，由 NovelX / hook 调用）──
  entity_designer:
    name: Entity Designer
    layer: world
    tier: extended
    default_active: false
    description: 新增/补全人物·物品·地点设定卡，写入前过冲突审计
    activation:
      - condition: has_new_entity_hints
        reason: 出现待设计的新实体
      - condition: no_nomenclature
        reason: 尚无实体体系，需要设计卡

  setting_auditor:
    name: Setting Auditor
    layer: qa
    tier: extended
    default_active: false
    description: 设定层冲突审计（规则体系/人设/物品/重复），不审章正文
    activation:
      - condition: has_bible
        reason: 已有 Bible，设定变更需冲突审计
      - condition: entity_count_gt
        threshold: 3
        reason: 实体增多，需设定一致性审计

  plot_designer:
    name: Plot Designer
    layer: story
    tier: extended
    default_active: false
    description: 为大纲整卷或卷内局部设计剧情卡，写入前过冲突审计
    activation:
      - condition: no_master_outline
        reason: 尚无总纲时可用剧情卡沉淀情节
      - condition: has_bible
        reason: 已有世界观，可用剧情卡插入与审计情节
