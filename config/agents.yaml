# Agent 注册表 — MVP 默认启用，扩展 Agent 按需激活
# activation 条件只产生「建议」；本章步骤 =
#   resolve_pipeline_agents(active_agents ∪ pipeline.mvp ∪ suggestions)
# 按 config/pipeline.yaml 的 order 执行（无独立 Orchestrator LLM）。
# 亦可用工具 activate_agents 显式激活扩展 Agent。
#
# 约定：
# - 执行顺序只认 pipeline.yaml 的 order（勿写 depends_on；运行时不读该字段）。
# - tier: mvp 的角色由 pipeline.mvp 每章纳入；勿再挂 activation（会被忽略）。

agents:
  # ── MVP / Studio 注册（实际章节步骤见 pipeline.yaml mvp∪order） ──

  studio_agent:
    name: NovelX Agent
    layer: orchestration
    tier: mvp
    description: NovelX 调度层 — REACT 解析用户意图，分配给功能 Agent

  chapter_planner:
    name: 章纲规划
    layer: story
    tier: mvp
    description: 输出单章详细章纲

  writer:
    name: 正文写作
    layer: production
    tier: mvp
    description: 按章纲撰写正文初稿

  consistency_auditor:
    name: 一致性审计
    layer: qa
    tier: mvp
    description: 检查人物、时间线、设定一致性

  summarizer:
    name: 章节摘要
    layer: memory
    tier: mvp
    description: 生成章节摘要与新事实清单

  plot_acceptor:
    name: 剧情验收
    layer: story
    tier: mvp
    description: 对照进行中剧情卡收束条件验收本章；通过则自动 completed

  lore_librarian:
    name: 设定检索
    layer: world
    tier: mvp
    description: >-
      Lore 确定性 query/assert（非 LLM）。章纲后切片注入 Writer；摘要后入库。

  pacing_reviewer:
    name: 节奏审查
    layer: qa
    tier: mvp
    description: 检查节奏与信息密度（MVP 每章必跑；节奏 P0 不阻断发布）

  # ── 扩展 Agent（按需激活） ──
  world_architect:
    name: 世界观架构
    layer: world
    tier: extended
    description: 搭建世界观 Bible
    activation:
      - condition: no_bible
        reason: 项目尚无世界观 Bible
      - condition: bible_stale
        reason: 设定变更超过 3 次未同步 Bible

  volume_auditor:
    name: 卷级复盘
    layer: qa
    tier: extended
    description: >-
      摘要层跨章复盘（audit_volume）；不进章流水线 order，由 Studio 工具调用
    activation:
      - condition: chapters_in_arc_gt
        threshold: 20
        reason: 本卷已写 20+ 章，建议 Studio 调用 audit_volume 做卷中复盘（与 mid_audit 门槛对齐）
      - condition: volume_handoff
        reason: 卷交接/待同步阶段，建议跑 audit_volume 再开下卷

  nomenclature_curator:
    name: 名词管理
    layer: world
    tier: extended
    description: 为人物/物品/设定取名，名与能力语义绑定，规避语料高频名
    activation:
      - condition: no_nomenclature
        reason: 尚无名词表，需建立与能力绑定的命名体系
      - condition: has_new_entity_hints
        reason: 本章出现未登记的新实体待命名

  master_planner:
    name: 总纲规划
    layer: story
    tier: extended
    description: 制定总纲
    activation:
      - condition: no_master_outline
        reason: 尚无总纲
      - condition: chapter_count_gt
        threshold: 30
        reason: 超过 30 章需复盘总纲偏离度

  arc_planner:
    name: 卷纲规划
    layer: story
    tier: extended
    description: 规划单卷/故事弧
    activation:
      - condition: no_arc_outline
        reason: 当前卷尚无卷纲
      - condition: chapters_in_arc_gt
        threshold: 8
        reason: 本卷已有 8+ 章但未规划卷纲

  dialogue_specialist:
    name: 对话专改
    layer: production
    tier: extended
    description: 专改对话声线与潜台词
    activation:
      - condition: dialogue_ratio_gt
        threshold: 0.4
        reason: 本章对话占比超过 40%
      - condition: character_count_gt
        threshold: 4
        reason: 同场对话人物超过 4 人

  scene_specialist:
    name: 场景专改
    layer: production
    tier: extended
    description: 专改场景与动作描写
    activation:
      - condition: has_scene_tags
        tags: [battle, chase, action, climax]
        reason: 章纲标记为战斗/追逐/高潮场景

  foreshadow_tracker:
    name: 伏笔追踪
    layer: qa
    tier: extended
    description: 追踪伏笔埋收（读 lore/foreshadow_index，禁止静默丢历史未收线）
    activation:
      - condition: active_foreshadows_gt
        threshold: 0
        reason: 已有未收伏笔，须每章核销/延期
      - condition: chapter_count_gt
        threshold: 10
        reason: >-
          第 11 章起建议巡检（摘要可先埋线）；longform lean 在无未收且奇数章会跳过，
          偶数章保留种植/巡检 cadence

  literary_editor:
    name: 文学润色
    layer: qa
    tier: extended
    description: 润色表达、去 AI 腔（非 MVP；activation 建议 + Studio activate_agents）
    activation:
      # 续写规划时 draft 多为空，勿用 word_count。用户点名润色由 Studio 持久激活。
      - condition: audit_fail_rate_gt
        threshold: 0.25
        reason: 近章审校失败率偏高，建议润色压重复与表述问题

  # ── 介入式设定 Agent（不进章流水线，由 NovelX / hook 调用）──
  entity_designer:
    name: 设定卡设计
    layer: world
    tier: extended
    description: 新增/补全人物·物品·地点设定卡，写入前过冲突审计
    activation:
      - condition: has_new_entity_hints
        reason: 出现待设计的新实体
      - condition: no_nomenclature
        reason: 尚无实体体系，需要设计卡

  setting_auditor:
    name: 设定审计
    layer: qa
    tier: extended
    description: 设定层冲突/遗漏/异常审计（含 stub 缺口与摘要漂移）；剧情收束后自动巡检
    activation:
      - condition: has_bible
        reason: 已有 Bible，设定变更需冲突审计
      - condition: entity_count_gt
        threshold: 3
        reason: 实体增多，需设定一致性审计

  plot_designer:
    name: 剧情卡设计
    layer: story
    tier: extended
    description: 为大纲整卷或卷内局部设计剧情卡，写入前过冲突审计
    activation:
      - condition: no_master_outline
        reason: 尚无总纲时可用剧情卡沉淀情节
      - condition: has_bible
        reason: 已有世界观，可用剧情卡插入与审计情节

  expectation_reviewer:
    name: 预期检阅
    layer: story
    tier: extended
    description: 检阅预处理预期事件是否可纳入当前章/卷；不改正文，决策权在用户
    # 不进章流水线；由 Studio `review_expected_events` 按需调用
    activation: []

  decision_council:
    name: 评审团
    layer: qa
    tier: extended
    description: 决策冲突加审；确定性聚合票，共识可自动修订，死锁才人审
    # 不进章流水线；in-process（不 spawn SubAgent）；见 decision_council.yaml
    activation: []

  material_researcher:
    name: 素材研究
    layer: story
    tier: extended
    description: >-
      剧情枯竭/需灵感时按需产出参考素材卡（非 Canon）；默认不进章流水线。
      由 Studio `research_materials` 或 activate_agents 显式调用。
    activation:
      - condition: plot_drought
        reason: 剧情冲突/钩子耗尽，建议补充背景素材
      - condition: inspiration_needed
        reason: 支路难分或质感不足，建议补充题材相关灵感素材

  # ── 短剧 / AI 漫剧（project_mode=short_drama）──
  episode_planner:
    name: 集纲规划
    layer: story
    tier: mvp
    description: 短剧单集场次/beat 集纲（pipeline-script）

  script_writer:
    name: 剧本草稿
    layer: production
    tier: mvp
    description: 按集纲撰写漫剧剧本 script.md

  beat_acceptor:
    name: Beat 验收
    layer: story
    tier: mvp
    description: 对照 beat/剧情卡收束条件验收本集（短剧语义的 plot_acceptor）
