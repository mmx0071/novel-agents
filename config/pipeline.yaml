# Chapter pipeline order + MVP set (Codex-style: edit here, not Rust consts).
# Agents not listed in `order` never run in the chapter pipeline (even if activated).
version: 1

# Execution order for continue_writing / revise chapter steps.
order:
  - chapter_planner
  - lore_librarian
  - writer
  - nomenclature_curator
  - dialogue_specialist
  - scene_specialist
  - consistency_auditor
  - foreshadow_tracker
  - pacing_reviewer
  - literary_editor
  - summarizer
  - plot_acceptor

# Always considered for every chapter (unioned with project active_agents + activation).
mvp:
  - chapter_planner
  - lore_librarian
  - writer
  - consistency_auditor
  - pacing_reviewer
  - summarizer
  - plot_acceptor

# Steps used when RunMode::AuditOnly (no writer).
audit_only:
  - consistency_auditor
  - pacing_reviewer

# Steps used for local-patch revise (prefer_local_patch path still may expand).
revise_default:
  - writer
  - consistency_auditor
  - pacing_reviewer
  - summarizer
  - plot_acceptor

# step → handler kind. specialist_rewrite agents share one Rust path; only need YAML.
# Unknown agents in `order` without a handler entry are skipped at runtime.
handlers:
  chapter_planner:
    kind: chapter_planner
  lore_librarian:
    kind: lore_query
  writer:
    kind: writer
  nomenclature_curator:
    kind: nomenclature
  dialogue_specialist:
    kind: specialist_rewrite
    focus: "只强化对话声线与潜台词，不改情节事实与章末钩子。"
  scene_specialist:
    kind: specialist_rewrite
    focus: "只强化场景空间与动作清晰度，不改情节事实与章末钩子。"
  literary_editor:
    kind: specialist_rewrite
    focus: "润色以下正文：去 AI 腔、修重复，不改剧情/设定/章末钩子。"
  consistency_auditor:
    kind: consistency
  pacing_reviewer:
    kind: pacing
  foreshadow_tracker:
    kind: foreshadow
  summarizer:
    kind: summarizer
  plot_acceptor:
    kind: plot_accept
