# Chapter pipeline order + MVP set (Codex-style: edit here, not Rust consts).
# Agents not listed in `order` never run in the chapter pipeline (even if activated).
version: 1

# Execution order for continue_writing / revise chapter steps.
# 专改/节奏/润色在一致性审计之前，避免改稿后再种设定/时间线雷且无复审。
order:
  - chapter_planner
  - lore_librarian
  - writer
  - nomenclature_curator
  - dialogue_specialist
  - scene_specialist
  - pacing_reviewer
  - literary_editor
  - consistency_auditor
  - foreshadow_tracker
  - summarizer
  - plot_acceptor

# Always considered for every chapter (unioned with project active_agents + activation).
mvp:
  - chapter_planner
  - lore_librarian
  - writer
  - consistency_auditor
  - pacing_reviewer
  - summarizer
  - plot_acceptor

# Steps used when RunMode::AuditOnly (no writer; no draft mutation from pacing autofix).
audit_only:
  - consistency_auditor
  - pacing_reviewer

# Steps used for *full* revise fallback (local-first uses `local_reviser` only).
revise_default:
  - writer
  - pacing_reviewer
  - consistency_auditor
  - summarizer
  - plot_acceptor

# step → handler kind. specialist_rewrite agents share one Rust path; only need YAML.
# Unknown agents in `order` without a handler entry are skipped at runtime.
handlers:
  chapter_planner:
    kind: chapter_planner
  lore_librarian:
    kind: lore_query
  writer:
    kind: writer
  # Same writer handler; separate id so ToolCall progress ≠「正在写新章」。
  local_reviser:
    kind: writer
  nomenclature_curator:
    kind: nomenclature
  dialogue_specialist:
    kind: specialist_rewrite
    focus: "只强化对话声线与潜台词，不改情节事实与章末钩子；勿改倒计时/钟点单调、伤部位、能力载体；禁止章号元叙述；修重复措辞时保留设定事实。"
  scene_specialist:
    kind: specialist_rewrite
    focus: "只强化场景空间与动作清晰度，不改情节事实与章末钩子；补伤痕不得挪移已登记受伤部位；勿改倒计时/钟点单调与能力载体；禁止章号元叙述。"
  literary_editor:
    kind: specialist_rewrite
    focus: "润色以下正文：去 AI 腔、修重复，不改剧情/设定/章末钩子；勿改倒计时/钟点单调、伤部位、能力载体；禁止章号元叙述。"
  consistency_auditor:
    kind: consistency
  pacing_reviewer:
    kind: pacing
  foreshadow_tracker:
    kind: foreshadow
  summarizer:
    kind: summarizer
  plot_acceptor:
    kind: plot_accept
