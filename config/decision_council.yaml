# Decision Council — multi-agent scoring for auto-resolve; escalate only on deadlock / infra / max retries.
# Strategies & thresholds live here; Rust loads and aggregates generically.
version: 1

kinds:
  audit_content:
    enabled: true
    max_auto_retries: 2
    min_score: 70
    # Mutually exclusive preferred_action scores within this margin → human gate.
    deadlock_epsilon: 8
    # Engine hard-blocks auto-accept when true P0 issues remain.
    allow_auto_accept_p0: false
    members:
      - role: consistency_auditor
        weight: 2
        veto: true
      - role: pacing_reviewer
        weight: 1
        veto: false
      - role: plot_acceptor
        weight: 1
        veto: false

  # Clean publish auto-continues writing (1C self-confirm). Disable to force chapter_next card.
  chapter_next_clean:
    enabled: true

  chapter_boundary_seal:
    enabled: true
    # When continue_writing_batch runs, seal Studio history at batch start/end.
    batch_per_chapter: true

material_researcher:
  enabled: true
  cooldown_chapters: 5
  max_cards_per_call: 3
  # Inject short hooks into these steps only (not writer by default).
  inject_into:
    - design_plot
    - chapter_planner
  motif_from:
    - brief
    - bible_themes
  # Max chars of material hooks in CanonContext / design brief.
  inject_chars: 900
