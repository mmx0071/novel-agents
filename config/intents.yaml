# Studio deterministic intents (thin matcher in Rust).
# Higher priority wins. Unmatched / enabled:false → LLM tool loop (more agentic).
# Keep enabled for high-confidence write/ops + single-chapter audit (desk CTA「审校第N章」).
# Softer query/design/volume-audit stay disabled → LLM multi-step.
version: 1

intents:
  # 「审这一卷 / 卷末复盘」→ 摘要层卷复盘（非逐章正文）
  - id: audit_volume
    tool: audit_volume
    enabled: false
    priority: 110
    require_project: true
    extract: none
    any_keywords:
      - 审这一卷
      - 审本卷
      - 卷末复盘
      - 复盘本卷
      - 复盘这一卷
      - audit_volume
    all_keyword_groups:
      - [审, 这一卷]
      - [审, 本卷]
      - [复盘, 卷]
    none_keywords:
      - 同步设定
      - sync_volume

  # 「审阅1-8章 / 第1章到第8章审校」→ audit_chapters queue
  - id: audit_range
    tool: audit_chapters
    enabled: false
    priority: 100
    require_project: true
    extract: chapter_range
    any_keywords:
      - 审
      - audit
      - 卷纲
    none_keywords:
      - 这一卷
      - 本卷
      - 卷末复盘
      - 复盘

  # 「继续审阅 / 继续审校队列」→ audit_chapters continue（续跑卡住的队列）
  - id: audit_queue_continue
    tool: audit_chapters
    priority: 105
    require_project: true
    extract: none
    any_keywords:
      - 继续审阅
      - 继续审校
      - 继续队列
      - 续跑审阅
    all_keyword_groups:
      - [继续, 审阅]
      - [继续, 审校]
    none_keywords:
      - 这一卷
      - 本卷
      - 卷末复盘
      - 写第

  # 「审校第9章 / 检阅第九章」→ audit_chapter（写作台 CTA / 偏好「审校最近章」）
  - id: audit_one
    tool: audit_chapter
    enabled: true
    priority: 80
    require_project: true
    extract: chapter
    any_keywords:
      - 审校
      - 审阅
      - 检阅
      - audit
    none_keywords:
      - 修正
      - 修订
      - 扩写
      - 重写
      - 加长
      - 这一卷
      - 本卷
      - 卷末复盘
      - 复盘
      - 继续
      - 到第
      - 至第

  # 「对照剧情卡到哪了 / 剧情进度 / 第N卷进行到哪了」→ list_plots（内嵌精简项目状态），禁止续写
  - id: plot_status
    tool: list_plots
    enabled: false
    priority: 85
    require_project: true
    extract: volume_optional
    any_keywords:
      - 剧情进度
      - 进行到哪了
      - 写到哪了
      - 现在写到哪
      - 卷进行到
      - 本卷到哪
      - 这一卷到哪
    all_keyword_groups:
      - [剧情卡, 到哪]
      - [剧情卡, 进度]
      - [对照, 剧情]
      - [剧情卡, 现在]
      - [主线, 到哪]
      - [进行中, 剧情]
      - [剧情, 推进]
      - [推进, 到哪]
      - [剧情, 到哪]
      - [剧情, 进行]
      - [故事, 到哪]
      - [第, 卷, 到哪]
      - [第, 卷, 进行]
      - [本卷, 进度]
      - [这一卷, 进度]
    none_keywords:
      - 写第
      - 续写
      - 写下一章
      - design_plot
      - 修改剧情
      - 更新剧情
      - 设计剧情
      - 审这一卷
      - 复盘

  # 「连写到卡点 / 批写 / 连续写几章」→ continue_writing_batch（遇硬门控停）
  - id: write_batch
    tool: continue_writing_batch
    priority: 75
    require_project: true
    extract: none
    any_keywords:
      - 连写到卡点
      - 无人值守连写
      - continue_writing_batch
      - 批写
    all_keyword_groups:
      - [连写, 卡点]
      - [连续, 写, 章]
      - [一口气, 写]
      - [自动, 连写]
    none_keywords:
      - 审这一卷
      - 复盘
      - design_plot
      - 到哪了
      - 进度

  # 「写第10章 / 续写 / 写下一章」→ continue_writing
  # 衔接章由剧情卡 needs_bridge（Agent）决定，0 或 1 章，用户无需声明
  # 复合任务（去重/卷纲/design_plot…再写第N章）勿命中：应交 LLM 分步执行
  - id: write_chapter
    tool: continue_writing
    priority: 70
    require_project: true
    extract: chapter_optional
    clear_history: on_start
    any_keywords:
      - 续写
      - 写下一章
      - 写下一
    # 写第…章（需同时命中）
    all_keyword_groups:
      - [写第, 章]
    none_keywords:
      - design_plot
      - design_arc
      - design_entity
      - delete_entity
      - sync_volume
      - 设定库
      - 去重
      - 卷纲
      - 剧情卡
      - 终态卡
      - 卷间交接
      - 到哪了
      - 进度
      - 对照
      - 连写到卡点
      - 批写
      - 一口气

  # 「重建总纲 / 生成总纲」→ design_master_outline（ready 项目也可确定性重入）
  - id: design_master_outline
    tool: design_master_outline
    enabled: false
    priority: 85
    require_project: true
    extract: none
    any_keywords:
      - 重建总纲
      - 生成总纲
      - 写总纲
      - 更新总纲
      - design_master_outline
    all_keyword_groups:
      - [重写, 总纲]
      - [修订, 总纲]
    none_keywords:
      - 卷纲
      - 章纲
      - 剧情卡

  # 「生成卷纲 / 重建卷纲 / 更新卷纲」→ design_arc_outline
  - id: design_arc_outline
    tool: design_arc_outline
    enabled: false
    priority: 84
    require_project: true
    extract: none
    any_keywords:
      - 重建卷纲
      - 生成卷纲
      - 写卷纲
      - 更新卷纲
      - design_arc_outline
    all_keyword_groups:
      - [重写, 卷纲]
      - [修订, 卷纲]
    none_keywords:
      - 总纲
      - 章纲
      - 剧情卡
      - 审这一卷
      - 卷末复盘

  # 「改第N章章纲 / 修正章纲 / 重写章纲」→ revise_outline（优先于改正文）
  - id: revise_outline
    tool: revise_outline
    enabled: false
    priority: 65
    require_project: true
    extract: chapter
    all_keyword_groups:
      - [改, 章纲]
      - [修, 章纲]
      - [修订, 章纲]
      - [修正, 章纲]
      - [更新, 章纲]
      - [重写, 章纲]
      - [调整, 章纲]
      - [revise, outline]
      - [改, outline]
    none_keywords:
      - 总纲
      - 卷纲
      - master_outline
      - arc_outline
    default_instructions: >-
      按对话要求修订本章章纲：保留未点名的情节骨架，落实点名修改（目标/冲突/关键事件/出场名单/章末钩子等），并与 CanonContext 一致。
    instructions_min_chars: 16

  # 「查看预期 / 列出预设事件」→ list_expected_events
  - id: list_expected_events
    tool: list_expected_events
    enabled: false
    priority: 75
    require_project: true
    extract: none
    any_keywords:
      - 查看预期
      - 列出预期
      - 预设事件
      - 预处理预期
      - 预期事件
      - list_expected
    all_keyword_groups:
      - [预期, 列表]
      - [预期, 查看]
      - [预设, 事件]
    none_keywords:
      - 检阅
      - 登记
      - 纳入

  # 「检阅预期」→ review_expected_events
  - id: review_expected_events
    tool: review_expected_events
    enabled: false
    priority: 76
    require_project: true
    extract: none
    any_keywords:
      - 检阅预期
      - 审预期
      - review_expected
    all_keyword_groups:
      - [检阅, 预期]
      - [审, 预期]
    none_keywords:
      - 审校
      - 审阅章
      - 这一卷

  # 「修正/扩写第五章」「按审校局部修订第N章」→ revise_chapter
  - id: revise_chapter
    tool: revise_chapter
    priority: 60
    require_project: true
    extract: chapter
    any_keywords:
      - 修正
      - 修订
      - 局部修订
      - 按审校
      - 扩写
      - 重写
      - 加长
      - 改写
      - 写长
      - 太短
      - 太少
      - rewrite
      - revise
      - expand
    # 「润色/去 AI 腔」不进本意图：交给 Studio → activate_agents(literary_editor)
    # 「改章纲」走 revise_outline
    none_keywords:
      - 润色
      - 去AI腔
      - 去 AI 腔
      - AI腔
      - 章纲
      - outline
    default_instructions: >-
      扩写/重写本章至约 5000–6000 字，按章纲补足情节与细节，保持与前后章衔接。
    instructions_min_chars: 24
