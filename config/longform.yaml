# Ultra-longform knobs (800–1000 chapters × 5–6k).
# String/enum settings live here; boolean toggles stay in features.yaml.
# Pair with decision_council.chapter_next_clean (see config/decision_council.yaml) for auto-continue cost.
version: 1

# economy | balanced | quality
# economy: aggressive lean (skip specialists when unneeded; foreshadow cadence)
# balanced: lean but keep foreshadow when open threads remain; specialists on tags;
#           peel nomenclature when table exists and no new-entity hints
# quality: no lean filtering (activation suggestions always kept)
quality_tier: balanced

# full | layered
# layered: routine chapters use lighter consistency context; climax / odd / reaudit → full.
# Trade-off: fewer tokens / faster routine audits; slightly higher miss risk vs full.
audit_tier: layered

# volume | indexed | all
# volume: active volume drafts only (default longform-safe)
# indexed: active volume + BM25/key-matched chapters across the book
# all: every published draft (expensive; opt-in)
impact_scan_mode: indexed

# Max successful publishes per continue_writing_batch / CLI --batch (not attempts)
batch_max_chapters: 20

# Max auto-revise attempts per chapter in batch (hard rules / consistency / length).
# 2: e.g. length expand first, then one consistency pass if expand introduces P0.
batch_max_auto_revise: 2

# Batch: auto AuditOnly retries when consistency fails only as audit_infra
# (empty / unparseable auditor). 0 = off (stop immediately like content FAIL).
batch_max_audit_infra_retries: 2

# Loop Engineering (outer Goal loop): online wake interval while web server runs.
# 0 = disable Automations wake scanner.
loop_wake_interval_secs: 120

# Stale Running job older than this is treated as crash → auto resume (if no active turn).
loop_stale_running_secs: 600

# After GoalReached/Quota with ≥N publishes, run deterministic volume_qa loop-end verify.
# 0 = off. Short drama skips.
loop_end_verify_min_chapters: 5

# Soft-short streak: when consecutive SoftShort publishes would reach this,
# the current SoftShort blocks publish (force expand). See chapter.yaml hard min.
soft_short_auto_revise_after: 3

# ForeshadowPhase: pressure > this → pressure_high (batch soft-stop; single-chapter advise only).
# 0 = off (phase stays clear). Unattended may skip via unattended.yaml skip_foreshadow_pressure.
# Pressure ≠ total dangling: fresh (within grace) and far-horizon do not count. See foreshadow_debt.
batch_max_dangling_foreshadow: 0

# Debt tiers (age = current_chapter − planted_chapter).
# - fresh: age ≤ grace → not counted for batch
# - near/mid: overdue pressure → counted (mid optional)
# - far: age > far_after, or horizon=far / urgency=low → never counted for batch
foreshadow_debt:
  grace_chapters: 6
  far_after_chapters: 40
  batch_count_mid: true
