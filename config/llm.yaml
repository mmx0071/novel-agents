profile: dev
retry:
  max_retries: 3
  base_delay_ms: 800
  max_delay_ms: 10000
dev_model: deepseek-v4-flash
providers:
  deepseek:
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: null
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    base_url: null
tasks:
  planning:
    description: 强推理 — 章纲、总纲、卷纲、世界观
    provider: deepseek
    model: deepseek-v4-pro
    temperature: 0.7
    max_tokens: 131072
  creative:
    description: 强创作 — 正文撰写
    provider: deepseek
    model: deepseek-v4-pro
    temperature: 0.85
    max_tokens: 131072
  editing:
    description: 润色修改 — 对话、场景、文学编辑
    provider: deepseek
    model: deepseek-v4-flash
    temperature: 0.6
    max_tokens: 32768
  patch:
    description: 局部修订 — 单段/时间锚点批量补丁
    provider: deepseek
    model: deepseek-v4-flash
    temperature: 0.4
    max_tokens: 32768
  analysis:
    description: 快速分析 — 一致性审计、节奏、伏笔、摘要
    provider: deepseek
    model: deepseek-v4-flash
    temperature: 0.2
    max_tokens: 32768
  naming:
    description: 名词设计 — 人物/物品/设定取名，名与能力语义绑定
    provider: deepseek
    model: deepseek-v4-pro
    temperature: 0.75
    max_tokens: 65536
  studio:
    description: NovelX 调度 — 意图解析与工具调用
    provider: deepseek
    model: deepseek-v4-flash
    temperature: 0.3
    max_tokens: 16384
agents:
  studio_agent: studio
  nomenclature_curator: naming
  world_architect: planning
  master_planner: planning
  arc_planner: planning
  chapter_planner: planning
  episode_planner: planning
  entity_designer: planning
  plot_designer: planning
  writer: creative
  script_writer: creative
  local_reviser: patch
  dialogue_specialist: editing
  scene_specialist: editing
  literary_editor: editing
  consistency_auditor: analysis
  volume_auditor: analysis
  setting_auditor: analysis
  foreshadow_tracker: analysis
  pacing_reviewer: analysis
  summarizer: analysis
  plot_acceptor: analysis
  beat_acceptor: analysis
  lore_librarian: analysis
  expectation_reviewer: analysis
  decision_council: analysis
  material_researcher: analysis
default_provider: deepseek
