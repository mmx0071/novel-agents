# Unattended (无人值守) soft-gate / soft-phase policy.
# Applied when studio.unattended_soft_skip=true (features.yaml).
# Hard gates always stop batch / auto-continue:
#   setup_phase / volume_phase handoff / chapter_order / plot gate /
#   consistency P0 / length hard / draft shape / volume end handoff /
#   volume_qa handoff_required (sync path).
# Soft phases below may be skipped so agents keep writing until a hard stop:
#   volume_qa mid_due · expected review · foreshadow pressure_high.
version: 1

batch:
  # VolumeQaPhase mid_due (studio.require_volume_audit_mid).
  skip_volume_audit_mid: true
  # Pre-approved expected-events review soft gate.
  skip_expected_review: true
  # ForeshadowPhase pressure_high soft stop on batch.
  skip_foreshadow_pressure: true

# Decision Council chapter_next_clean auto continue_writing (1 chapter).
council_auto_continue:
  skip_volume_audit_mid: true
  skip_expected_review: true
  skip_foreshadow_pressure: true

# Note in batch summary / result JSON when soft skips were applied by policy.
record_skipped_soft_gates: true
