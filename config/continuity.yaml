# Long-horizon continuity budgets (CanonContext / memory recall).
# Tiers apply by published_count (已发布章数). First matching max_published wins;
# the last tier is the fallback for larger novels.
version: 1

tiers:
  - max_published: 30
    memory_section: 2000
    dangling_show: 8
    archive_thread_recall: 2
    summary_recall: 2
    asserted_facts: 6
    volume_rollups: 2
    bridge_chars: 900
  - max_published: 120
    memory_section: 2400
    dangling_show: 10
    archive_thread_recall: 3
    summary_recall: 4
    asserted_facts: 8
    volume_rollups: 3
    bridge_chars: 1000
  - max_published: 200
    memory_section: 3000
    dangling_show: 12
    archive_thread_recall: 4
    summary_recall: 6
    asserted_facts: 12
    volume_rollups: 4
    bridge_chars: 1100
  - max_published: 500
    memory_section: 3400
    dangling_show: 14
    archive_thread_recall: 5
    summary_recall: 8
    asserted_facts: 22
    volume_rollups: 8
    bridge_chars: 1200
  - max_published: 0   # 0 = unlimited / default for 500+
    memory_section: 4200
    dangling_show: 16
    archive_thread_recall: 8
    summary_recall: 12
    asserted_facts: 36
    volume_rollups: 12
    bridge_chars: 1300
