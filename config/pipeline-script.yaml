# Short-drama episode pipeline (project_mode=short_drama).
# Loaded via PipelineConfig::load_for_mode — does not replace pipeline.yaml for longform.
version: 1

order:
  - episode_planner
  - lore_librarian
  - script_writer
  - dialogue_specialist
  - scene_specialist
  - pacing_reviewer
  - consistency_auditor
  - summarizer
  - beat_acceptor

mvp:
  - episode_planner
  - lore_librarian
  - script_writer
  - consistency_auditor
  - pacing_reviewer
  - summarizer
  - beat_acceptor

audit_only:
  - consistency_auditor
  - pacing_reviewer

revise_default:
  - script_writer
  - pacing_reviewer
  - consistency_auditor
  - summarizer
  - beat_acceptor

handlers:
  episode_planner:
    kind: chapter_planner
  lore_librarian:
    kind: lore_query
  script_writer:
    kind: writer
  local_reviser:
    kind: writer
  dialogue_specialist:
    kind: specialist_rewrite
    focus: >-
      只强化剧本对白声线与潜台词，保留场号/【画面】/集末【钩子】；
      勿改情节事实与角色知情范围；禁止章号元叙述。
  scene_specialist:
    kind: specialist_rewrite
    focus: >-
      只强化【画面】与动作行清晰度，不改对白事实与集末钩子；
      补画面不得改已写明的道具持有/伤势侧别。
  consistency_auditor:
    kind: consistency
  pacing_reviewer:
    kind: pacing
  summarizer:
    kind: summarizer
  beat_acceptor:
    kind: plot_accept
