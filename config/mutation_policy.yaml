# Mutation severity policy — routine tools auto-apply; high tools still need human confirm.
# Requires studio.require_mutation_confirm=true and studio.mutation_severity_policy=true.
version: 1

mode: severity

# Tools that always open confirm_mutation (Canon / structure / irreversible).
# Text content writes use git-style −/+ preview before apply.
high_tools:
  - delete_entity
  - design_master_outline
  - design_arc_outline
  - upsert_setting
  - supplement_setting
  - replan_volume
  - restore_version_node
  - design_entity
  - design_plot
  - revise_outline
  - update_plot
  - revise_chapter
  - split_chapter

# Tools that self-confirm (no human card) when severity policy is on.
# Keep pure progress / enqueue ops here — not document body rewrites.
routine_tools:
  - continue_writing
  - continue_writing_batch
  - activate_agents
  - enqueue_expected_event
  - update_expected_event
  - resolve_expected_event

# Unknown mutation kinds default to high (safer).

impact:
  # Auto-run cascade when all conditions match; otherwise keep confirm_impact.
  auto_max_hits: 5
  # Never auto when source kind is one of these.
  never_auto_sources:
    - bible
    - master_outline
  # Never auto when any hit targets these kinds (would confirm_skip high tools).
  never_auto_targets:
    - draft
    - arc_outline
    - master_outline
    - bible
  # If any hit targets draft, require human (multi-chapter rewrite risk).
  block_auto_on_draft_targets: true
